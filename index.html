    <!-- Loop protection Guard -->
    <script>
      (function() {
        try {
          // Prevent infinite automated page reload loops
          var key = '__qazan_reload_guard';
          var raw = sessionStorage.getItem(key);
          var now = Date.now();
          var data = raw ? JSON.parse(raw) : { count: 0, time: 0 };
          
          if (now - data.time < 8000) {
            data.count += 1;
          } else {
            data.count = 1;
          }
          data.time = now;
          sessionStorage.setItem(key, JSON.stringify(data));

          if (data.count >= 2) {
            console.warn('[QAZAN Guard] Blocked automated reload loop to keep page stable.');
            // Intercept window.location.reload
            var originalReload = window.location.reload.bind(window.location);
            window.location.reload = function() {
              console.warn('[QAZAN Guard] Automated location.reload call blocked.');
            };
          }
        } catch (e) {
          // Silent fallback
        }
      })();
    </script>
