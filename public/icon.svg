<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Card Illustration -->
  <g transform="translate(96, 120)">
    <!-- Base Card -->
    <rect width="320" height="200" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    
    <!-- Card Chip / Glow -->
    <rect x="36" y="40" width="56" height="42" rx="8" fill="url(#primary)"/>
    <line x1="36" y1="61" x2="92" y2="61" stroke="#b45309" stroke-width="2"/>
    <line x1="64" y1="40" x2="64" y2="82" stroke="#b45309" stroke-width="2"/>

    <!-- Wifi Waves on Card -->
    <path d="M 230 50 A 45 45 0 0 1 270 90" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 245 65 A 25 25 0 0 1 270 90" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="270" cy="90" r="5" fill="#10b981"/>

    <!-- Card Brand Text -->
    <text x="36" y="145" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="2">QAZAN-NET</text>
    <text x="36" y="175" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="16">قعزان نت لإدارة شبكات الكروت</text>

    <!-- Barcode simulation -->
    <g transform="translate(230, 135)" fill="#64748b">
      <rect x="0" y="0" width="3" height="35"/>
      <rect x="6" y="0" width="6" height="35"/>
      <rect x="16" y="0" width="2" height="35"/>
      <rect x="22" y="0" width="5" height="35"/>
      <rect x="31" y="0" width="2" height="35"/>
      <rect x="37" y="0" width="8" height="35"/>
      <rect x="49" y="0" width="3" height="35"/>
    </g>
  </g>

  <!-- Network Connected Dots Bottom -->
  <circle cx="160" cy="390" r="12" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="16" fill="#10b981" filter="url(#glow)"/>
  <circle cx="352" cy="390" r="12" fill="#f59e0b" filter="url(#glow)"/>
  <line x1="160" y1="390" x2="256" y2="380" stroke="#475569" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="256" y1="380" x2="352" y2="390" stroke="#475569" stroke-width="4" stroke-dasharray="6 6"/>
</svg>
